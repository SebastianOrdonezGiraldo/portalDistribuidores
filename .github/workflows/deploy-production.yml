name: Deploy Production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production via SSH
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'master'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOY_URL: https://pedidos.importcorporalmedical.com
      SSH_HOST: ${{ secrets.VPS_HOST_PRODUCTION || secrets.VPS_HOST }}
      SSH_PORT: ${{ secrets.VPS_SSH_PORT_PRODUCTION || secrets.VPS_SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.VPS_USER_PRODUCTION || secrets.VPS_USER }}
      SSH_KEY: ${{ secrets.VPS_SSH_KEY_PRODUCTION || secrets.VPS_SSH_KEY }}
      SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE_PRODUCTION || secrets.VPS_SSH_PASSPHRASE }}

    steps:
      - name: Check SSH port reachability
        run: |
          set -euo pipefail
          echo "Resolviendo ${SSH_HOST}..."
          getent ahostsv4 "$SSH_HOST" || getent ahosts "$SSH_HOST" || true

          echo "Probando conectividad TCP IPv4 a ${SSH_HOST}:${SSH_PORT}..."
          for attempt in 1 2 3; do
            echo "Intento ${attempt}/3..."
            if nc -4 -vz -w 15 "$SSH_HOST" "$SSH_PORT"; then
              exit 0
            fi
            sleep 3
          done

          echo "::error title=SSH no accesible::No se pudo abrir TCP IPv4 a ${SSH_HOST}:${SSH_PORT}. Verifica los secretos VPS_HOST_PRODUCTION/VPS_HOST y VPS_SSH_PORT_PRODUCTION/VPS_SSH_PORT, que sshd escuche en ese puerto y que el firewall o fail2ban permitan conexiones desde GitHub-hosted runners." >&2
          exit 1

      - name: Deploy production on VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          passphrase: ${{ env.SSH_PASSPHRASE }}
          port: ${{ env.SSH_PORT }}
          protocol: tcp4
          command_timeout: 25m
          debug: true
          script: |
            set -e
            cd /var/www/portalDistribuidores
            sudo bash deploy.sh

      - name: Smoke check production
        run: |
          for attempt in 1 2 3 4 5; do
            status_code="$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" --max-time 20 "$DEPLOY_URL" || true)"
            echo "Intento ${attempt}: HTTP ${status_code}"

            case "$status_code" in
              200|301|302)
                exit 0
                ;;
            esac

            sleep 5
          done

          echo "Smoke check fallido para ${DEPLOY_URL}"
          exit 1
