name: Promote Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve staged master artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      ALLOWED_DEPLOYER: SebastianOrdonezGiraldo
    outputs:
      promotion_sha: ${{ steps.identity.outputs.promotion_sha }}
      source_sha: ${{ steps.proof.outputs.source_sha }}
      source_tree: ${{ steps.identity.outputs.source_tree }}
      ci_run_id: ${{ steps.proof.outputs.ci_run_id }}
      archive_sha256: ${{ steps.proof.outputs.archive_sha256 }}
    steps:
      - name: Authorize manual promoter
        run: |
          [[ "$GITHUB_ACTOR" == "$ALLOWED_DEPLOYER" ]] || {
            echo "Only ${ALLOWED_DEPLOYER} may promote production." >&2
            exit 1
          }
      - name: Checkout current master
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: master
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          coverage: none
      - name: Resolve master tree and staging proof
        id: identity
        run: |
          promotion_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          proof_name="staging-proof-${source_tree}"
          proof_record="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
            -f name="$proof_name" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0] | [.name, (.workflow_run.id | tostring)] | @tsv')"
          [[ -n "$proof_record" && "$proof_record" != "null" ]] || {
            echo "No staged artifact matches master tree ${source_tree}." >&2
            exit 1
          }
          IFS=$'\t' read -r proof_name proof_run_id <<< "$proof_record"
          echo "promotion_sha=$promotion_sha" >> "$GITHUB_OUTPUT"
          echo "source_tree=$source_tree" >> "$GITHUB_OUTPUT"
          echo "proof_name=$proof_name" >> "$GITHUB_OUTPUT"
          echo "proof_run_id=$proof_run_id" >> "$GITHUB_OUTPUT"
      - name: Download staging proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.identity.outputs.proof_name }}
          path: ${{ runner.temp }}/staging-proof
          repository: ${{ github.repository }}
          run-id: ${{ steps.identity.outputs.proof_run_id }}
          github-token: ${{ github.token }}
      - name: Validate staging proof
        id: proof
        run: |
          php -r '
            $proof = json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
            foreach (["source_commit", "source_tree", "archive_sha256", "ci_run_id"] as $field) {
              if (!array_key_exists($field, $proof)) { exit(1); }
            }
            if ($proof["source_tree"] !== $argv[2]
              || !preg_match("/^[0-9a-f]{40}$/", $proof["source_commit"])
              || !preg_match("/^[0-9a-f]{64}$/", $proof["archive_sha256"])
              || !is_int($proof["ci_run_id"])) { exit(1); }
            $output = getenv("GITHUB_OUTPUT");
            file_put_contents($output, "source_sha=".$proof["source_commit"].PHP_EOL, FILE_APPEND);
            file_put_contents($output, "ci_run_id=".$proof["ci_run_id"].PHP_EOL, FILE_APPEND);
            file_put_contents($output, "archive_sha256=".$proof["archive_sha256"].PHP_EOL, FILE_APPEND);
          ' "$RUNNER_TEMP/staging-proof/proof.json" "${{ steps.identity.outputs.source_tree }}"
      - name: Validate staged ancestry
        run: |
          git merge-base --is-ancestor "${{ steps.proof.outputs.source_sha }}" "${{ steps.identity.outputs.promotion_sha }}" || {
            echo "The staged source commit is not an ancestor of master." >&2
            exit 1
          }
          if [[ -n "$GITHUB_STEP_SUMMARY" ]]; then
            {
              echo "### Production candidate"
              echo
              echo "- Master: \`${{ steps.identity.outputs.promotion_sha }}\`"
              echo "- Staged source: \`${{ steps.proof.outputs.source_sha }}\`"
              echo "- Tree: \`${{ steps.identity.outputs.source_tree }}\`"
              echo "- Artifact digest: \`${{ steps.proof.outputs.archive_sha256 }}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy Production
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
      deployments: write
    environment:
      name: production
      url: https://pedidos.importcorporalmedical.com
    env:
      DEPLOY_URL: https://pedidos.importcorporalmedical.com
      DEPLOY_BASE_DIR: /var/www/portalDistribuidores
      SSH_HOST: ${{ secrets.VPS_HOST_PRODUCTION || secrets.VPS_HOST }}
      SSH_PORT: ${{ secrets.VPS_SSH_PORT_PRODUCTION || secrets.VPS_SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.VPS_USER_PRODUCTION || secrets.VPS_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY_PRODUCTION || secrets.VPS_SSH_KEY }}
      SSH_EXPECTED_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT_PRODUCTION || secrets.VPS_SSH_FINGERPRINT }}
    steps:
      - name: Checkout deployment tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.promotion_sha }}
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          coverage: none
      - name: Download staged artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portal-${{ needs.resolve.outputs.source_sha }}
          path: ${{ runner.temp }}/release-artifact
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve.outputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Verify artifact identity
        run: |
          cd "$RUNNER_TEMP/release-artifact"
          sha256sum --check SHA256SUMS
          [[ "$(awk '{print $1}' "$RUNNER_TEMP/release-artifact/SHA256SUMS")" == "${{ needs.resolve.outputs.archive_sha256 }}" ]]
          php -r '
            $manifest = json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
            if (($manifest["source_commit"] ?? null) !== $argv[2] || ($manifest["source_tree"] ?? null) !== $argv[3]) { exit(1); }
          ' "$RUNNER_TEMP/release-artifact/manifest.json" \
            "${{ needs.resolve.outputs.source_sha }}" \
            "${{ needs.resolve.outputs.source_tree }}"
      - name: Verify SSH identity
        id: ssh
        run: bash .github/scripts/prepare-ssh.sh
        env:
          SSH_HOST: ${{ env.SSH_HOST }}
          SSH_PORT: ${{ env.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ env.SSH_PRIVATE_KEY }}
          SSH_EXPECTED_FINGERPRINT: ${{ env.SSH_EXPECTED_FINGERPRINT }}
      - name: Promote exact staged artifact
        run: bash .github/scripts/deploy-over-ssh.sh
        env:
          DEPLOY_ENVIRONMENT: production
          DEPLOY_BASE_DIR: ${{ env.DEPLOY_BASE_DIR }}
          DEPLOY_URL: ${{ env.DEPLOY_URL }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          PROMOTION_SHA: ${{ needs.resolve.outputs.promotion_sha }}
          ARTIFACT_DIR: ${{ runner.temp }}/release-artifact
          SSH_HOST: ${{ env.SSH_HOST }}
          SSH_PORT: ${{ env.SSH_PORT }}
          SSH_USER: ${{ env.SSH_USER }}
          SSH_KEY_PATH: ${{ steps.ssh.outputs.key_path }}
          SSH_KNOWN_HOSTS_PATH: ${{ steps.ssh.outputs.known_hosts_path }}
          ROLLBACK_DRILL: "false"

  release:
    name: Create GitHub Release
    needs:
      - resolve
      - deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PROMOTION_SHA: ${{ needs.resolve.outputs.promotion_sha }}
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      SOURCE_TREE: ${{ needs.resolve.outputs.source_tree }}
      ARCHIVE_SHA256: ${{ needs.resolve.outputs.archive_sha256 }}
    steps:
      - name: Checkout release history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.PROMOTION_SHA }}
          fetch-depth: 0
      - name: Create idempotent patch release
        run: |
          git fetch --tags
          existing_tag="$(git tag --points-at "$PROMOTION_SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [[ -n "$existing_tag" ]] && gh release view "$existing_tag" >/dev/null 2>&1; then
            echo "Release ${existing_tag} already exists for ${PROMOTION_SHA}."
            exit 0
          fi

          latest="$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [[ -n "$existing_tag" ]]; then
            next="$existing_tag"
          elif [[ -z "$latest" ]]; then
            next="v1.0.0"
          else
            major="${latest#v}"; major="${major%%.*}"
            remainder="${latest#v${major}.}"
            minor="${remainder%%.*}"
            patch="${latest##*.}"
            next="v${major}.${minor}.$((patch + 1))"
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            echo "## Deployment evidence"
            echo
            echo "- Production commit: \`${PROMOTION_SHA}\`"
            echo "- Staged source commit: \`${SOURCE_SHA}\`"
            echo "- Source tree: \`${SOURCE_TREE}\`"
            echo "- Artifact SHA-256: \`${ARCHIVE_SHA256}\`"
            echo
            echo "## Changes"
            if [[ -n "$latest" ]]; then
              git log "${latest}..${PROMOTION_SHA}" --pretty=format:'- %s (%h)'
              echo
            else
              git log "$PROMOTION_SHA" -20 --pretty=format:'- %s (%h)'
              echo
            fi
          } > "$notes_file"

          gh release create "$next" \
            --title "Release $next" \
            --notes-file "$notes_file" \
            --target "$PROMOTION_SHA"
