name: Deploy Staging

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy staging via SSH
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'develop'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_URL: https://staging-pedidos.importcorporalmedical.com
      SSH_HOST: ${{ secrets.VPS_HOST_STAGING || secrets.VPS_HOST }}
      SSH_PORT: ${{ secrets.VPS_SSH_PORT_STAGING || secrets.VPS_SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.VPS_USER_STAGING || secrets.VPS_USER }}
      SSH_KEY: ${{ secrets.VPS_SSH_KEY_STAGING || secrets.VPS_SSH_KEY }}
      SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE_STAGING || secrets.VPS_SSH_PASSPHRASE }}
      SSH_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT_STAGING || secrets.VPS_SSH_FINGERPRINT || 'SHA256:Nn8HNB6eIEZqkk2+eYcbJ3vmnIdeWS+3+87t/EI0rUo' }}

    steps:
      - name: Check SSH port reachability
        run: |
          echo "Probando conectividad TCP a ${SSH_HOST}:${SSH_PORT}..."
          nc -vz -w 10 "$SSH_HOST" "$SSH_PORT"

      - name: Deploy staging on VPS
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          passphrase: ${{ env.SSH_PASSPHRASE }}
          port: ${{ env.SSH_PORT }}
          fingerprint: ${{ env.SSH_FINGERPRINT }}
          command_timeout: 25m
          script: |
            set -e
            cd /var/www/portalDistribuidores-staging
            sudo bash deploy.sh

      - name: Smoke check staging
        run: |
          for attempt in 1 2 3 4 5; do
            status_code="$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" --max-time 20 "$DEPLOY_URL" || true)"
            echo "Intento ${attempt}: HTTP ${status_code}"

            case "$status_code" in
              200|301|302)
                exit 0
                ;;
            esac

            sleep 5
          done

          echo "Smoke check fallido para ${DEPLOY_URL}"
          exit 1
