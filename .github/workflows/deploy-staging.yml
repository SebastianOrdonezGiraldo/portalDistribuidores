name: Staging Drill

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Successful develop SHA to redeploy; blank uses current develop"
        required: false
        type: string
      rollback_drill:
        description: "Force a post-switch failure, verify rollback, then redeploy"
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: read
  deployments: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  drill:
    name: Deploy and verify staging
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: staging
      url: https://staging-pedidos.importcorporalmedical.com
    env:
      GH_TOKEN: ${{ github.token }}
      DEPLOY_URL: https://staging-pedidos.importcorporalmedical.com
      DEPLOY_BASE_DIR: /var/www/portalDistribuidores-staging
      SSH_HOST: ${{ secrets.VPS_HOST_STAGING || secrets.VPS_HOST }}
      SSH_PORT: ${{ secrets.VPS_SSH_PORT_STAGING || secrets.VPS_SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.VPS_USER_STAGING || secrets.VPS_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY_STAGING || secrets.VPS_SSH_KEY }}
      SSH_EXPECTED_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT_STAGING || secrets.VPS_SSH_FINGERPRINT }}
      REQUESTED_SOURCE: ${{ inputs.source_sha }}
    steps:
      - name: Resolve successful develop artifact
        id: resolve
        run: |
          source_sha="$REQUESTED_SOURCE"
          if [[ -z "$source_sha" ]]; then
            source_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/develop" --jq '.object.sha')"
          fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source_sha must be a full Git SHA." >&2
            exit 1
          }
          ci_run_id="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f branch=develop \
            -f event=push \
            -f status=success \
            -f per_page=100 \
            --jq ".workflow_runs[] | select(.head_sha == \"${source_sha}\") | .id" \
            | head -n 1)"
          [[ -n "$ci_run_id" ]] || {
            echo "No successful develop CI run was found for ${source_sha}." >&2
            exit 1
          }
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "ci_run_id=$ci_run_id" >> "$GITHUB_OUTPUT"
      - name: Checkout deployment tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.resolve.outputs.source_sha }}
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          coverage: none
      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portal-${{ steps.resolve.outputs.source_sha }}
          path: ${{ runner.temp }}/release-artifact
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve.outputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Read artifact identity
        id: artifact
        run: |
          php -r '
            $manifest = json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
            if (($manifest["source_commit"] ?? null) !== $argv[2]) { exit(1); }
            file_put_contents(getenv("GITHUB_OUTPUT"), "source_tree=".$manifest["source_tree"].PHP_EOL, FILE_APPEND);
          ' "$RUNNER_TEMP/release-artifact/manifest.json" "${{ steps.resolve.outputs.source_sha }}"
          echo "archive_sha256=$(awk '{print $1}' "$RUNNER_TEMP/release-artifact/SHA256SUMS")" >> "$GITHUB_OUTPUT"
      - name: Verify SSH identity
        id: ssh
        run: bash .github/scripts/prepare-ssh.sh
        env:
          SSH_HOST: ${{ env.SSH_HOST }}
          SSH_PORT: ${{ env.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ env.SSH_PRIVATE_KEY }}
          SSH_EXPECTED_FINGERPRINT: ${{ env.SSH_EXPECTED_FINGERPRINT }}
      - name: Run staging deployment
        run: bash .github/scripts/deploy-over-ssh.sh
        env:
          DEPLOY_ENVIRONMENT: staging
          DEPLOY_BASE_DIR: ${{ env.DEPLOY_BASE_DIR }}
          DEPLOY_URL: ${{ env.DEPLOY_URL }}
          SOURCE_SHA: ${{ steps.resolve.outputs.source_sha }}
          PROMOTION_SHA: ${{ steps.resolve.outputs.source_sha }}
          ARTIFACT_DIR: ${{ runner.temp }}/release-artifact
          SSH_HOST: ${{ env.SSH_HOST }}
          SSH_PORT: ${{ env.SSH_PORT }}
          SSH_USER: ${{ env.SSH_USER }}
          SSH_KEY_PATH: ${{ steps.ssh.outputs.key_path }}
          SSH_KNOWN_HOSTS_PATH: ${{ steps.ssh.outputs.known_hosts_path }}
          ROLLBACK_DRILL: ${{ inputs.rollback_drill }}
      - name: Create staging proof
        run: |
          mkdir -p "$RUNNER_TEMP/staging-proof"
          php -r '
            file_put_contents($argv[1], json_encode([
              "schema" => 1,
              "source_commit" => $argv[2],
              "source_tree" => $argv[3],
              "archive_sha256" => $argv[4],
              "ci_run_id" => (int) $argv[5],
              "deployed_at" => gmdate("c"),
              "rollback_drill" => $argv[6] === "true",
            ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES).PHP_EOL);
          ' "$RUNNER_TEMP/staging-proof/proof.json" \
            "${{ steps.resolve.outputs.source_sha }}" \
            "${{ steps.artifact.outputs.source_tree }}" \
            "${{ steps.artifact.outputs.archive_sha256 }}" \
            "${{ steps.resolve.outputs.ci_run_id }}" \
            "${{ inputs.rollback_drill }}"
      - name: Upload staging proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-proof-${{ steps.artifact.outputs.source_tree }}
          path: ${{ runner.temp }}/staging-proof/proof.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true
