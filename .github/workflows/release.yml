name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: latest_tag
        run: |
          git fetch --tags
          latest="$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || echo '')"
          echo "tag=${latest}" >> "$GITHUB_OUTPUT"
          echo "Latest tag: ${latest}"

      - name: Compute next version
        id: next_version
        run: |
          latest="${{ steps.latest_tag.outputs.tag }}"
          if [ -z "$latest" ]; then
            next="v1.0.0"
          else
            # Increment patch version
            major=$(echo "$latest" | cut -d. -f1 | tr -d 'v')
            minor=$(echo "$latest" | cut -d. -f2)
            patch=$(echo "$latest" | cut -d. -f3)
            patch=$((patch + 1))
            next="v${major}.${minor}.${patch}"
          fi
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${next}"

      - name: Generate release notes
        id: release_notes
        run: |
          latest="${{ steps.latest_tag.outputs.tag }}"
          if [ -z "$latest" ]; then
            notes="$(git log --pretty=format:'- %s (%h)' | head -20)"
          else
            notes="$(git log "${latest}..HEAD" --pretty=format:'- %s (%h)')"
          fi
          if [ -z "$notes" ]; then
            notes="- Actualización de dependencias y mejoras menores"
          fi
          # Write notes to file to handle special characters
          printf '%s\n' "$notes" > /tmp/release_notes.txt
          echo "notes_file=/tmp/release_notes.txt" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.next_version.outputs.version }}" \
            --title "Release ${{ steps.next_version.outputs.version }}" \
            --notes-file "${{ steps.release_notes.outputs.notes_file }}" \
            --target "${{ github.sha }}"
