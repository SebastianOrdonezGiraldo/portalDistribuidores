name: Deploy to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check SSH port reachability
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_SSH_PORT || '22' }}"
          echo "Probando conectividad TCP a ${HOST}:${PORT}..."
          nc -vz -w 10 "$HOST" "$PORT"
      - name: Deploy en VPS
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          debug: true
          script: |
            cd /var/www/portalDistribuidores
            sudo bash deploy.sh
