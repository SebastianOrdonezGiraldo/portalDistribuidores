; =============================================================================
; laravel-queue-supervisor.conf - Configuracion de Supervisor (legacy alias for production)
; Prefer systemd with deploy/laravel-queue.service or deploy/laravel-queue-staging.service
;
; Usar esta configuración SI PREFIERES Supervisor en lugar de systemd.
; Para la mayoria de casos en Ubuntu 24.04, se recomienda systemd.
;
; Instrucciones:
;   sudo apt install -y supervisor
;   sudo mkdir -p /var/log/laravel && sudo chown www-data:www-data /var/log/laravel
;   sudo cp deploy/laravel-queue-supervisor.conf /etc/supervisor/conf.d/laravel-queue.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start laravel-queue:*
;   sudo supervisorctl status
; =============================================================================

[program:laravel-queue]
; Nombre del proceso visible en supervisorctl
process_name=%(program_name)s_%(process_num)02d

; Comando del worker:
;   --sleep=3          Espera 3s si la cola está vacía
;   --tries=3          Máximo 3 intentos por job fallido
;   --max-time=3600    Reinicia el proceso cada hora
;   --queue=default    Cola que procesa (ORDER_NOTIFICATION_EMAIL_DISPATCH=queue la usa)
command=/usr/bin/php /var/www/portalDistribuidores/current/artisan queue:work \
    --sleep=3 \
    --tries=3 \
    --timeout=600 \
    --max-time=3600 \
    --queue=default

; Número de procesos worker en paralelo
; Con QUEUE_CONNECTION=database y volumen bajo de pedidos, 1 proceso es suficiente.
; Aumentar si hay picos de notificaciones de correo simultáneas.
numprocs=1

; Usuario bajo el que corre el proceso
user=www-data

; Iniciar automáticamente con supervisord
autostart=true

; Reiniciar si el proceso termina inesperadamente
autorestart=true

; Parar todos los procesos del grupo juntos
stopasgroup=true
killasgroup=true

; Tiempo de espera para shutdown graceful (debe cubrir el job más largo)
stopwaitsecs=3700
stopsignal=TERM

; Logs
stdout_logfile=/var/log/laravel/queue-prod.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/laravel/queue-prod-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

; Redirigir stderr a stdout
redirect_stderr=false
