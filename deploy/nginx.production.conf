# =============================================================================
# Nginx - Portal Distribuidores (production)
# Host: pedidos.importcorporalmedical.com
# Root: /var/www/portalDistribuidores/current/public
# Render with deploy/bootstrap-release-layout.sh; do not copy with the TLS marker.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name pedidos.importcorporalmedical.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # __HTTPS_LISTEN_CONFIGURATION__

    server_name pedidos.importcorporalmedical.com;

    # __TLS_CONFIGURATION__

    root /var/www/portalDistribuidores/current/public;
    index index.php;

    client_max_body_size 65M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
    # Alpine usa AsyncFunction para evaluar x-data, x-show y eventos declarativos.
    # Los hosts externos se limitan a Google Analytics y Google Fonts.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; frame-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; object-src 'none'" always;

    charset utf-8;

    access_log /var/log/nginx/portal-distribuidores.access.log;
    error_log /var/log/nginx/portal-distribuidores.error.log warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /up {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        try_files $uri /index.php?$query_string;
    }

    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;
    error_page 413 /413.html;

    location = /413.html {
        internal;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;
    gzip_min_length 1000;
}
