# =============================================================================
# Nginx - Portal Distribuidores (legacy alias for production)
# Prefer: deploy/nginx.production.conf
#
# Instrucciones:
#   1. Copiar a /etc/nginx/sites-available/portal-distribuidores
#   2. Si no usas los hosts por defecto, reemplaza el server_name
#   3. Ejecutar: ln -s /etc/nginx/sites-available/portal-distribuidores \
#                        /etc/nginx/sites-enabled/portal-distribuidores
#   4. nginx -t && systemctl reload nginx
#   5. Luego obtener SSL con: certbot --nginx -d pedidos.importcorporalmedical.com
# =============================================================================

# Redirigir todo HTTP a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name pedidos.importcorporalmedical.com;

    # Permitir que Certbot valide el dominio
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name pedidos.importcorporalmedical.com;

    # Directorio raíz: apunta a public/ de Laravel
    root /var/www/portalDistribuidores/public;
    index index.php;

    # ── Tamaño máximo de uploads ────────────────────────────────────────────
    # Debe quedar por encima del limite funcional de la app (40 MB) para absorber
    # el overhead del formulario multipart sin provocar falsos 413.
    client_max_body_size 45M;

    # ── SSL — Certbot lo rellena automáticamente al ejecutar certbot --nginx ─
    # ssl_certificate     /etc/letsencrypt/live/tu-dominio.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tu-dominio.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Cabeceras de seguridad ───────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"            always;
    add_header X-Content-Type-Options    "nosniff"               always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy        "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy   "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; frame-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; object-src 'none'" always;

    charset utf-8;

    # ── Logs ─────────────────────────────────────────────────────────────────
    access_log  /var/log/nginx/portal-distribuidores.access.log;
    error_log   /var/log/nginx/portal-distribuidores.error.log  warn;

    # ── Routing principal de Laravel ─────────────────────────────────────────
    # Sirve el archivo si existe; si no, lo pasa a index.php (Laravel router)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /up {
        return 404;
    }

    # ── Archivos estáticos del build de Vite ─────────────────────────────────
    # Los assets en public/build/ tienen hashes en el nombre → cacheable para siempre
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Assets estáticos generales ────────────────────────────────────────────
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # ── Archivos especiales ───────────────────────────────────────────────────
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;
    error_page 413 /413.html;

    location = /413.html {
        internal;
    }

    # ── PHP-FPM ───────────────────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass   unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;

        # Timeout ampliado para generación de PDFs y operaciones largas
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;

        # Buffer generoso para respuestas de Laravel
        fastcgi_buffer_size     128k;
        fastcgi_buffers         4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # ── Denegar acceso a archivos ocultos (.env, .git, etc.) ─────────────────
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;
    gzip_min_length 1000;
}
