[phases.setup]
nixPkgs = [
    "php84",
    "php84Packages.composer",
    "php84Extensions.pgsql",
    "php84Extensions.mbstring",
    "php84Extensions.xml",
    "php84Extensions.curl",
    "php84Extensions.zip",
    "php84Extensions.gd",
    "php84Extensions.intl",
    "php84Extensions.bcmath",
    "php84Extensions.tokenizer",
    "php84Extensions.ctype",
    "php84Extensions.fileinfo",
    "php84Extensions.dom",
    "nodejs_20",
    "nodePackages.npm"
]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm ci"
]

[phases.build]
cmds = [
    "npm run build"
]

[start]
cmd = "php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan storage:link && (php artisan queue:work --queue=default --sleep=1 --tries=5 --timeout=120 --no-interaction & php artisan serve --host=0.0.0.0 --port=$PORT)"
